name: Android CI - Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Jetpack Compose modern membutuhkan minimal Java 17
        distribution: 'temurin'
        cache: gradle

    - name: Generate .env File from Secrets
      run: |
        echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
      # Catatan: Jika proyek membaca .env.example sebagai fallback saat .env kosong, 
      # langkah ini bisa disesuaikan atau dilewati jika rahasia diatur via gradle.properties.

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lintas-POC-OsakaPTT-APK
        path: app/build/outputs/apk/debug/app-debug.apk
